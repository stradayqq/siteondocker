services:
  site:
    build: ./site
    restart: unless-stopped
    expose:
     - "80"    
    networks:
     - webnet

nginx:
  image: nginx:alpine
  restart: unless-stopped
  ports:
   - "80:80"
  volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf.ro
  depends_on:
    - site
  networks:
    - webnet
    
networks:
  webnet: